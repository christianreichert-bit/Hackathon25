<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pantry - Food Expiration Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="app-header">
            <h1>🏠 Smart Pantry</h1>
            <p class="tagline">AI-powered food expiration tracking</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Upload Section -->
            <section class="upload-section">
                <h2>Add Food Items</h2>
                <div class="upload-card">
                    <div class="upload-area">
                        <input type="file" id="imageUpload" accept="image/*" capture="environment">
                        <label for="imageUpload" class="upload-button">
                            <span class="upload-icon">📸</span>
                            <span class="upload-text">Take Food Photo</span>
                        </label>
                    </div>
                    <p class="upload-help">Take a picture of your food items or upload from gallery</p>
                </div>
            </section>

            <!-- Manual Add Section -->
            <section class="manual-add-section">
                <h3>Or Add Manually</h3>
                <div class="manual-form">
                    <input type="text" id="foodName" placeholder="Enter food name (e.g., Milk, Apples)">
                    <button id="addManualButton" class="add-button">Add to Pantry</button>
                </div>
            </section>

            <!-- Pantry Display -->
            <section class="pantry-section">
                <h2>Your Pantry</h2>
                <div class="pantry-stats">
                    <div class="stat">
                        <span class="stat-number" id="totalItems">0</span>
                        <span class="stat-label">Total Items</span>
                    </div>
                    <div class="stat">
                        <span class="stat-number" id="expiringSoon">0</span>
                        <span class="stat-label">Expiring Soon</span>
                    </div>
                </div>

                <div class="pantry-list">
                    <div id="itemsContainer" class="empty-state">
                        <div class="empty-icon">🥺</div>
                        <h3>Your pantry is empty</h3>
                        <p>Add some food items to get started!</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>Powered by AWS AI • Built for Life Hacking</p>
        </footer>
    </div>

    <!-- JavaScript will be added here later -->
    <script src="app.js"></script>
</body>
</html>
